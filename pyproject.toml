[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeromind"
version = "0.1.0"
description = "AeroMind proof of concept: onboard (edge) predictive aircraft health and maintenance intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=8", "onnx>=1.15", "onnxruntime>=1.17"]

[project.scripts]
aeromind = "aeromind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeromind = ["dashboard_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
