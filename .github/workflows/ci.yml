name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      # The copilot must never need a key or the network in CI: providers are mocked in the tests.
      AEROMIND_LLM_PROVIDER: "off"
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + ONNX + ground station; torch/hummingbird/playwright tests skip)
        run: pip install -e ".[dev]"
      - name: LLM copilot tests (no API key, no network)
        run: pytest tests/llm -q -p no:warnings
      - name: All tests
        run: pytest -q -p no:warnings
      - name: CLI smoke
        run: |
          python -m aeromind llm doctor
          python -m aeromind --help
